[project]
name = "inbox-forge"
version = "0.1.0"
description = "Turn a folder of .eml files into searchable JSON"
authors = [{ name = "Tanuj", email = "Tanuj@cmu.edu" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
inbox-forge = "inbox_forge.__main__:main"

[dependency-groups]
dev = ["pytest>=9.2", "ruff>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
